include hyde.conf

# Minimal Tab bar styling
tab_bar_edge                top
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# remap to open new kitty tab in the same directory (default is home dir)
# map ctrl+shift+t            new_tab_with_cwd

# Uncomment the following 4 lines to minimize kitty latency (higher energy usage)
input_delay 0
repaint_delay 2
# sync_to_monitor no
wayland_enable_ime no

# HolyChowders
font_family family="DSETypewriterLH Nerd Font Mono" wght=100
font_size 15.0
text_composition_strategy 5.00 0
bold_font        auto
italic_font      auto
bold_italic_font auto
modify_font cell_height 100%
modify_font cell_width 100%

window_padding_width 2
hide_window_decorations yes
remember_window_size no # required for tiling

